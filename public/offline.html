<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#185B47">
    <title>You're offline · Homeschool OS</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #F7F8F3; color: #202C28; font-family: Nunito, Arial, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #dce8e0; border-radius: 22px; background: #fffefa; text-align: center; }
      .mark { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 17px; background: #e4f3e9; color: #185B47; font-size: 30px; }
      h1 { margin: 0 0 10px; font-size: 25px; }
      p { color: #667d73; line-height: 1.65; font-size: 14px; }
      button { margin-top: 12px; min-height: 46px; padding: 0 20px; border: 0; border-radius: 11px; background: #185B47; color: white; font-weight: 700; font-size: 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>You're offline</h1>
      <p>Homeschool OS needs an internet connection to securely load your family's learning plans and progress. Reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
