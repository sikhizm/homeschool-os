name: Verify learning workspace
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run curriculum:framework-audit
      - run: npm run curriculum:catalogue-audit
      - run: npm run phase6:quality
      # GitHub-hosted Ubuntu runners provide the system libraries Chromium needs.
      # Avoid --with-deps here: it invokes apt against Ubuntu mirrors, which can
      # fail independently of the project when runner DNS/mirrors are unavailable.
      - run: npx playwright install chromium
      - name: Browser workflow with isolated PostgreSQL fixtures
        env:
          STUDY_PACK_BASELINE: ${{ github.event.pull_request.base.sha }}
        run: |
          CHROMIUM_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" npm run test:ui
      - name: Upload global search screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-search-screenshots
          path: /tmp/homeschool-global-search-*.png
          if-no-files-found: ignore
      - name: Upload study pack before and after screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: study-pack-before-after
          path: /tmp/study-pack-*.png
          if-no-files-found: ignore
      - name: Isolated production build (no production credentials)
        env:
          NEON_AUTH_BASE_URL: http://127.0.0.1:4987
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -eu
          export NEON_AUTH_COOKIE_SECRET="$(openssl rand -hex 32)"
          npm run build

          server_log=/tmp/homeschool-server.log
          server_pid=
          cleanup() {
            if [ -n "$server_pid" ]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          # Launch Next directly so the tracked PID is the actual server process,
          # not npm's intermediary shell process.
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000 > "$server_log" 2>&1 < /dev/null &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Next.js server exited before becoming ready."
              cat "$server_log"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Next.js server did not become ready within 60 seconds."
            cat "$server_log"
            exit 1
          fi

          echo "Next.js production server is ready."
          npm run test:smoke

  audit-ncert-pdfs:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/ncert-batch-pdf-verification')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Check Class 10 chapter PDF candidates
        run: npm run --silent curriculum:check-pdfs -- --grade 10 > /tmp/ncert-pdf-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: ncert-pdf-audit
          path: /tmp/ncert-pdf-audit.json
          if-no-files-found: error
